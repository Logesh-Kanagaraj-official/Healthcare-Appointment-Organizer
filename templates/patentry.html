{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment — MediCare Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020617;--primary:#3B82F6;--primary-light:#60A5FA;--accent:#0EA5E9;--text:#F8FAFC;--muted:#94A3B8;--border:rgba(255,255,255,0.12)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.bg-canvas{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 60% at 20% 40%,#1E3A8A1a,transparent),radial-gradient(ellipse 60% 50% at 80% 15%,#0EA5E91a,transparent),#020617}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.1;animation:blobF ease-in-out infinite;z-index:-1;pointer-events:none}
.b1{width:600px;height:600px;background:#3B82F6;top:-200px;left:-200px;animation-duration:12s}
.b2{width:500px;height:500px;background:#0EA5E9;bottom:-150px;right:-150px;animation-duration:10s;animation-delay:-4s}
@keyframes blobF{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.05)}}
/* NAV */
.topnav{position:fixed;top:0;left:0;right:0;height:66px;background:rgba(2,6,23,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 2rem;justify-content:space-between;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:1rem;color:var(--text);text-decoration:none}
.logo-box{width:34px;height:34px;background:linear-gradient(135deg,#3B82F6,#0EA5E9);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.nav-sub-txt{display:block;font-size:.6rem;font-weight:400;color:var(--muted)}
.back-btn{padding:7px 18px;border-radius:100px;font-size:.8rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;transition:all .3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary-light)}
/* FORM */
.page{padding:66px 0 0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:90px;padding-bottom:3rem}
.form-card{background:rgba(255,255,255,.06);backdrop-filter:blur(32px);border:1px solid var(--border);border-radius:28px;padding:2.75rem;width:100%;max-width:580px;margin:0 auto;box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative;overflow:hidden}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.form-header{margin-bottom:2rem}
.form-icon{width:50px;height:50px;background:linear-gradient(135deg,#3B82F6,#0EA5E9);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1rem}
.form-title{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.3rem}
.form-sub{color:var(--muted);font-size:.875rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1.15rem}
label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:.45rem;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.9rem;pointer-events:none;color:var(--muted)}
input,select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:14px;padding:11px 14px 11px 40px;color:var(--text);font-family:'Inter',sans-serif;font-size:.88rem;outline:none;transition:all .3s;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--primary);background:rgba(59,130,246,.1);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
input::placeholder{color:rgba(148,163,184,.45)}
select option{background:#0F172A;color:var(--text)}
input[type=datetime-local]{padding-left:40px}
input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5;cursor:pointer}
.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,#3B82F6,#0EA5E9);color:#fff;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:.75rem;box-shadow:0 0 24px rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(59,130,246,.6)}
.divider-line{height:1px;background:var(--border);margin:1.5rem 0}
@media(max-width:580px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<nav class="topnav">
  <a class="nav-logo" href="{% url 'home' %}">
    <div class="logo-box">🏥</div>
    <span>MediCare Pro<span class="nav-sub-txt">Appointment Management</span></span>
  </a>
  <a href="{% url 'home' %}" class="back-btn">← Back to Dashboard</a>
</nav>

<div class="page">
  <div style="width:100%;max-width:580px;margin:0 auto;padding:0 1rem">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">📅</div>
        <h1 class="form-title">Book Appointment</h1>
        <p class="form-sub">Fill in the details to schedule your doctor appointment</p>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="form-row">
          <div class="form-group">
            <label>Patient Full Name</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" name="fname" placeholder="Full name" required>
            </div>
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <div class="input-wrap">
              <span class="input-icon">📱</span>
              <input type="tel" name="mobno" placeholder="10-digit number" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" name="email" placeholder="patient@email.com" required>
          </div>
        </div>

        <div class="divider-line"></div>

        <div class="form-row">
          <div class="form-group">
            <label>Doctor Name</label>
            <div class="input-wrap">
              <span class="input-icon">🩺</span>
              <input type="text" name="Docname" placeholder="Doctor's name" required>
            </div>
          </div>
          <div class="form-group">
            <label>Appointment Date & Time</label>
            <div class="input-wrap">
              <span class="input-icon">📅</span>
              <input type="datetime-local" name="patdt" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Purpose of Visit</label>
          <div class="input-wrap">
            <span class="input-icon">📋</span>
            <input type="text" name="prpse" placeholder="e.g. General checkup, Follow-up, Consultation" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">📅 Confirm Appointment</button>
      </form>
    </div>
  </div>
</div>

<script>
window.addEventListener('load',function(){
  if(typeof gsap==='undefined') return;
  gsap.from('.form-card',{opacity:0,y:30,duration:.7,ease:'power3.out'});
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
</body>
</html>
